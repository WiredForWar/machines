name: Build

on:
  push:
  pull_request:

jobs:
  game_data_archive:
    name: "Prepare game data archive"
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with:
        path: "machines-data"
        repository: "WiredForWar/machines-data"

    - name: "Get the current machines-data version info"
      run: |
        cd ${{github.workspace}}/machines-data
        echo "data_commit=$(git rev-parse HEAD)" >> $GITHUB_ENV

    - uses: actions/cache@v4
      id: data_cache
      with:
        path: ${{github.workspace}}/machines-data/install/machines
        key: "${{ env.data_commit }}"
        enableCrossOsArchive: true

    - name: Prepare the system (Linux)
      if: steps.data_cache.outputs.cache-hit != 'true'
      run: |
        sudo apt-get update
        sudo machines-data/scripts/prepare-system.sh

    - name: "Bake the data"
      if: steps.data_cache.outputs.cache-hit != 'true'
      run: |
        SKIP_GRAYSCALE=y machines-data/scripts/install.sh

    - name: Upload the data
      uses: actions/upload-artifact@v7
      with:
        name: machines-data
        path: ${{github.workspace}}/machines-data/install/machines

  data_pack:
    name: "Prepare the data pack"
    needs: game_data_archive
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with:
        path: "machines-packager"
        repository: "WiredForWar/machines-packager"

    - uses: actions/download-artifact@v4
      with:
        name: machines-data
        path: "machines-packager/data-pack/baked-machines-data"

    - name: Prepare data pack
      run: |
        machines-packager/data-pack/gen-machines-data-pack.sh

    - name: Upload the data pack
      uses: actions/upload-artifact@v7
      with:
        name: machines-data-pack
        path: ${{github.workspace}}/machines-data-pack-*.zip

  build:
    needs: data_pack
    runs-on: ${{ matrix.os }}
    env:
      BUILD_TAG: "wfw"
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-24.04
          build-type: Release
          conan: true
          tests: true

        # Clang is stricter than GCC in places and warns about things GCC does
        # not, so it is worth one job of its own. Linux, as the runners are
        # cheaper than the Windows ones and the image already ships Clang.
        - os: ubuntu-24.04
          compiler: clang
          build-type: Release
          conan: true
          tests: true

        - os: ubuntu-24.04
          toolchain: mingw64
          build-type: Release
          package: true
          package-name: machines-win64

        - os: windows-2025
          build-type: Release
          conan: true
          package: true
          package-name: machines-win64-msvc

    steps:
    - uses: actions/checkout@v4
      if: contains(matrix.toolchain, 'mingw')
      with:
        path: "machines-packager"
        repository: "WiredForWar/machines-packager"

    - uses: actions/checkout@v4
      with:
        path: "sources"
        fetch-tags: true

    - name: Prepare the system (Linux)
      if: contains(matrix.os, 'ubuntu')
      run: |
        sudo apt-get update
        sudo sources/scripts/prepare-system.sh
        sudo apt-get install pkg-config

    - name: Prepare mingw (Linux)
      if: contains(matrix.toolchain, 'mingw')
      run: |
        sudo apt-get install -y mingw-w64

    - name: Prepare MSVC (Windows)
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1

    - name: Install Conan
      if: matrix.conan
      run: pip install conan

    # Conan takes the compiler for a detected profile from CC and CXX before it
    # looks anywhere else, and those name the job's compiler by the time the
    # provider asks. Detecting the profile here instead, before the compiler is
    # chosen, is what keeps the dependencies on the one the image came with.
    - name: Detect the Conan profile while the image compiler is still the one in view
      if: matrix.conan && matrix.compiler
      run: conan profile detect

    - name: Cache the Conan packages
      if: matrix.conan
      uses: actions/cache@v4
      with:
        path: ~/.conan2/p
        key: "conan2-${{ matrix.os }}-${{ hashFiles('sources/conanfile.py') }}"
        restore-keys: |
          conan2-${{ matrix.os }}-

    - name: Configure
      shell: cmake -P {0}
      run: |
        set(toolchain "${{ matrix.toolchain }}")
        file(TO_CMAKE_PATH "$ENV{GITHUB_WORKSPACE}" WORKSPACE_DIR)

        set(compiler "${{ matrix.compiler }}")
        if(compiler STREQUAL "clang")
          set(cmake_compiler_args "-DCMAKE_C_COMPILER=clang" "-DCMAKE_CXX_COMPILER=clang++")
          # Keep the dependencies on the default profile instead of letting the
          # provider derive one from the compiler. This job is here to compile
          # our own code with Clang; ConanCenter has no Clang binaries, so a
          # Clang profile means building the whole dependency tree from source,
          # which is both slow and at the mercy of every upstream release URL.
          list(APPEND cmake_compiler_args "-DCONAN_HOST_PROFILE=default")
        endif()

        if(toolchain)
          set(cmake_toolchain_args "-DCMAKE_TOOLCHAIN_FILE=cmake/Toolchain-${toolchain}.cmake")
            if(toolchain MATCHES ".*mingw.*")
                list(APPEND cmake_toolchain_args "-DWINDOWS_DEPENDENCIES_DIR=${WORKSPACE_DIR}/machines-packager/mingw64/win-dev-libs")
            endif()
            if(toolchain MATCHES ".*32.*")
                list(APPEND cmake_toolchain_args "-DBUILD_32=1")
            endif()
        endif()
        if("${{ matrix.tests }}" STREQUAL "true")
          # Both options are passed explicitly: the tests only build for a
          # development build, and relying on the DEV_BUILD default is what
          # silently stopped the tests from being built at all.
          set(cmake_dev_build_args "-DDEV_BUILD=ON" "-DBUILD_TESTS=ON")
        else()
          set(cmake_dev_build_args "-DDEV_BUILD=OFF")
        endif()
        if("${{ matrix.conan }}" STREQUAL "true")
          set(cmake_conan_args "-DCMAKE_PROJECT_TOP_LEVEL_INCLUDES=cmake/conan_provider.cmake")
          # Let Conan install the system packages its recipes need (e.g. the
          # X11/xcb -dev packages pulled in by xorg/system for SDL on Linux).
          # The inner ';' are escaped so the whole value reaches the child cmake
          # as a single -D argument (a CONAN_INSTALL_ARGS list).
          list(APPEND cmake_conan_args "-DCONAN_INSTALL_ARGS=--build=missing\;-c\;tools.system.package_manager:mode=install\;-c\;tools.system.package_manager:sudo=True")
        endif()

        execute_process(COMMAND ${CMAKE_COMMAND}
          -S ${WORKSPACE_DIR}/sources
          -B ${WORKSPACE_DIR}/build
          -GNinja
          -DCMAKE_BUILD_TYPE=${{ matrix.build-type }}
          -DCMAKE_INSTALL_PREFIX=${WORKSPACE_DIR}/install/machines
          -DBUILD_PLANETED=TRUE
          ${cmake_compiler_args}
          ${cmake_toolchain_args}
          ${cmake_dev_build_args}
          ${cmake_conan_args}
          RESULT_VARIABLE CONF_RESULT
        )

        if(CONF_RESULT)
            message(FATAL_ERROR "Configuration failed")
        endif()

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{ matrix.build-type }} --target all

    - name: Test
      if: matrix.tests
      working-directory: ${{github.workspace}}/build
      run: ctest -C ${{ matrix.build-type }} --output-on-failure --no-tests=error

    - name: Trim the Conan cache before it is saved
      if: matrix.conan
      run: conan cache clean "*"

    - name: Install
      if: matrix.package
      run: cmake --build ${{github.workspace}}/build --config ${{ matrix.build-type }} --target install

    - name: Remove the editor from the distribution
      if: matrix.package
      run: cmake -E remove ${{github.workspace}}/install/machines/planeted.exe

    - name: Download the data pack
      if: matrix.package
      uses: actions/download-artifact@v4
      with:
        name: machines-data-pack

    - name: Unpack the data pack
      if: matrix.package
      shell: bash
      run: cmake -E tar xf machines-data-pack-*.zip

    - name: Add the data pack
      if: matrix.package
      run: cmake -E copy_directory ${{github.workspace}}/machines-data-pack ${{github.workspace}}/install/machines

    - name: Add runtime libraries (mingw)
      if: matrix.package && contains(matrix.toolchain, 'mingw')
      run: |
        cp -arv ${{github.workspace}}/machines-packager/mingw64/win-dev-libs/x86_64-w64-mingw32/bin/* ${{github.workspace}}/install/machines
        cp -arv ${{github.workspace}}/machines-packager/mingw64/win64-extra-files/* ${{github.workspace}}/install/machines

    - name: Add runtime libraries (MSVC)
      if: matrix.package && runner.os == 'Windows'
      run: Copy-Item "$env:VCToolsRedistDir\x64\Microsoft.VC*.CRT\*.dll" ${{github.workspace}}\install\machines\

    - name: Create the package (Linux)
      if: matrix.package && runner.os == 'Linux'
      working-directory: ${{github.workspace}}/install
      run: |
        sudo apt install -y p7zip-full
        7z a ${{ matrix.package-name }}-$BUILD_TAG-$(date +%Y%m%d).7z machines

    - name: Create the package (Windows)
      if: matrix.package && runner.os == 'Windows'
      working-directory: ${{github.workspace}}/install
      run: 7z a ${{ matrix.package-name }}-$env:BUILD_TAG-$(Get-Date -Format yyyyMMdd).7z machines

    - name: Upload the package
      if: matrix.package
      uses: actions/upload-artifact@v7
      with:
        path: ${{github.workspace}}/install/${{ matrix.package-name }}-*.7z
        archive: false
